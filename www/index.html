<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2f7d4f">
  <title>农业经理人四级速记</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">农</span>
      <div>
        <h1>农业经理人四级速记</h1>
        <p id="app-subtitle">12 模块 · 48 题 · 离线学习</p>
      </div>
    </div>
    <button id="theme-btn" class="icon-btn" aria-label="切换主题">🌙</button>
  </header>

  <main id="app" class="app-main">
    <section class="view" id="view-modules"></section>
    <section class="view hidden" id="view-cards"></section>
    <section class="view hidden" id="view-review"></section>
    <section class="view hidden" id="view-practice"></section>
    <section class="view hidden" id="view-exam"></section>
    <section class="view hidden" id="view-wrong"></section>
  </main>

  <nav class="tabbar">
    <button class="tab active" data-view="modules"><span>📚</span>模块</button>
    <button class="tab" data-view="cards"><span>🃏</span>卡片</button>
    <button class="tab" data-view="review"><span>🧠</span>复习</button>
    <button class="tab" data-view="practice"><span>✏️</span>练习</button>
    <button class="tab" data-view="exam"><span>📝</span>考试</button>
    <button class="tab" data-view="wrong"><span>⭐</span>错题</button>
  </nav>

  <div id="toast" class="toast hidden"></div>

  <script>
const APP_VERSION = '1.0.2';
  </script>
  <script src="data/data-inline.js"></script>
  <script src="js/data-loader.js"></script>
  <script src="js/cloze-state.js"></script>
  <script src="js/srs.js"></script>
  <script src="js/infer-tag.js"></script>
  <script src="js/notes-renderer.js"></script>
  <script src="js/daily-review.js"></script>
  <script src="js/question-generator.js"></script>
  <script src="js/practice.js"></script>
  <script src="js/order-quiz.js"></script>
  <script src="js/exam.js"></script>
  <script src="js/wrong-book.js"></script>
  <script src="js/cloze-timer.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
