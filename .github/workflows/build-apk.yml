name: Build 农业经理人四级速记 APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK components
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Auto-bump version
        id: version
        run: |
          OLD_VER=$(grep "^const APP_VERSION" www/index.html | sed "s/.*'\(.*\)'.*/\1/")
          MAJOR=$(echo "$OLD_VER" | cut -d. -f1)
          MINOR=$(echo "$OLD_VER" | cut -d. -f2)
          PATCH=$(echo "$OLD_VER" | cut -d. -f3)
          NEW_VER="${MAJOR}.${MINOR}.$((PATCH + 1))"
          VCODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH + 1 ))
          echo "APP_VERSION=$NEW_VER" >> $GITHUB_OUTPUT
          echo "TAG_NAME=v$NEW_VER" >> $GITHUB_OUTPUT
          sed -i "s/^const APP_VERSION = '${OLD_VER}';/const APP_VERSION = '${NEW_VER}';/" www/index.html
          sed -i "s/versionName \"${OLD_VER}\"/versionName \"${NEW_VER}\"/" android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode $VCODE/" android/app/build.gradle
          echo "version bump: $OLD_VER -> $NEW_VER (versionCode $VCODE)"

      - name: Install dependencies
        run: npm install

      - name: Build and verify app data
        run: npm run build:data && npm run verify

      - name: Sync Capacitor
        run: npx cap sync

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename and verify APK
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK" || { echo "APK 不存在"; exit 1; }
          unzip -t "$APK" > /dev/null
          NAME="agri-manager-l4-fastcard-v${{ steps.version.outputs.APP_VERSION }}.apk"
          cp "$APK" "$NAME"
          sha256sum "$NAME" > "$NAME.sha256"
          echo "APK: $NAME"

      - name: Create Release
        run: |
          TAG="${{ steps.version.outputs.TAG_NAME }}"
          VER="${{ steps.version.outputs.APP_VERSION }}"
          gh release delete "$TAG" --yes 2>/dev/null || true
          git tag -d "$TAG" 2>/dev/null || true
          gh release create "$TAG" \
            --title "农业经理人四级速记 v${VER}" \
            --notes "离线速记 APK，包含 12 模块 / 48 题 / 记忆曲线 / 模拟考试。" \
            --latest \
            agri-manager-l4-fastcard-v${VER}.apk agri-manager-l4-fastcard-v${VER}.apk.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add www/index.html android/app/build.gradle
          git commit -m "chore: bump version to ${{ steps.version.outputs.APP_VERSION }} [skip ci]" || echo "no changes to commit"
          git push
